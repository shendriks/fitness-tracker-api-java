spring:
  application:
    name: fitness-tracker-api-spring-boot
  datasource:
    #url: jdbc:h2:file:../fitness_db;DB_CLOSE_ON_EXIT=FALSE
    #driverClassName: org.h2.Driver
    #username: sa
    #password: sa
    url: jdbc:mysql://mysql:3306/fitnessdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  sql:
    init:
      mode: always
      data-locations: 
          - optional:classpath:data.sql
          - optional:classpath:fixtures.sql
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
  #    show-sql: true
  #    properties:
  #      hibernate:
  #        format_sql: true 
#    h2:
#      console:
#        enabled: true
#        settings:
#          trace: false
#          web-allow-others: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB 

springdoc:
#  writer-with-order-by-keys: true
  api-docs:
    path: /api-docs
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: MySuperS3cr37JWTSecret
  expiration: 86400
  issuer: dev.shendriks.fitnesstrackerapi
