spring:
  application:
    name: fitness-tracker-api-spring-boot
  datasource:
    url: jdbc:h2:file:../fitness_db
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      settings:
        trace: false
        web-allow-others: false

springdoc:
  api-docs:
    path: /api-docs

