spring:
  application:
    name: fitness-tracker-api-spring-boot
  datasource:
    url: jdbc:mysql://mysql:3306/fitnessdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  sql:
    init:
      mode: always
      data-locations: 
          - optional:classpath:data.sql
          - optional:classpath:fixtures.sql
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
  #    show-sql: true
  #    properties:
  #      hibernate:
  #        format_sql: true 
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB 

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: MySuperS3cr37JWTSecret
  expiration: 86400
  issuer: dev.shendriks.fitnesstrackerapi
