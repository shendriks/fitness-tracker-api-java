spring:
  application:
    name: fitness-tracker-api-spring-boot
  datasource:
    url: jdbc:h2:file:../fitness_db;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
#    show-sql: true
#    properties:
#      hibernate:
#        format_sql: true 
  h2:
    console:
      enabled: true
      settings:
        trace: false
        web-allow-others: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 1MB
      max-request-size: 1MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.jdbc.bind: TRACE
