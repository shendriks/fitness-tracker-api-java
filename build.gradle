plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '9.0.0'
}

group = 'dev.shendriks'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    integrationTest {
        java {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
    integrationTestImplementation.extendsFrom(testImplementation)
    integrationTestRuntimeOnly.extendsFrom(testRuntimeOnly)
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter:3.5.6'
    implementation 'org.springframework.boot:spring-boot-starter-security:3.5.6'
    implementation 'org.springframework.boot:spring-boot-starter-websocket:3.5.6'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.6'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.5.6'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.togglz:togglz-spring-boot-starter:4.4.0'
    implementation 'com.github.f4b6a3:ulid-creator:5.2.3'
    implementation 'com.auth0:java-jwt:4.5.0'
    implementation 'io.github.jamsesso:json-logic-java:1.1.0'
    implementation 'io.jenetics:jpx:3.2.1'
    runtimeOnly 'com.h2database:h2:2.4.240'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testImplementation 'org.springframework.security:spring-security-test:6.5.6'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.6'
    testImplementation 'org.mockito:mockito-core:5.+'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    mockitoAgent('org.mockito:mockito-core:5.+') {
        transitive = false
    }
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

tasks.register('integrationTest', Test) {
    description = "Run integration tests"
    group = "verification"
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
    shouldRunAfter(tasks.named('test'))
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn check
    reports {
        xml.required = false
        csv.required = true
        html.outputLocation = layout.buildDirectory.dir('jacoco/report/html')
        csv.outputLocation = layout.buildDirectory.file('jacoco/report/csv/jacocoTestReport.csv')
    }
    getExecutionData().setFrom(fileTree(layout.buildDirectory).include("/jacoco/*.exec"))
}