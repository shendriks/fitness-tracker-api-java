plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '8.14'
}

group = 'dev.shendriks'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    integrationTest {
        java {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
    integrationTestImplementation.extendsFrom(testImplementation)
    integrationTestRuntimeOnly.extendsFrom(testRuntimeOnly)
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter:3.5.3'
    implementation 'org.springframework.boot:spring-boot-starter-security:3.5.3'
    implementation 'org.springframework.boot:spring-boot-starter-websocket:3.5.3'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.3'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.5.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
    implementation 'com.github.f4b6a3:ulid-creator:5.2.3'
    implementation 'com.auth0:java-jwt:4.5.0'
    implementation 'io.github.jamsesso:json-logic-java:1.1.0'
    runtimeOnly 'com.h2database:h2:2.3.232'
    testImplementation 'org.springframework.security:spring-security-test:6.5.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.3'
    testImplementation 'org.mockito:mockito-core:5.+'
    mockitoAgent('org.mockito:mockito-core:5.+') {
        transitive = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

tasks.register('integrationTest', Test) {
    description = "Run integration tests"
    group = "verification"
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}