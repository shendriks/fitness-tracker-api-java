# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
    
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build -i

      - name: Generate Jacoco Json
        uses: cicirello/jacoco-badge-generator@v2.12.1
        id: jacoco
        with:
          #generate-branches-badge: false
          #generate-coverage-endpoint: true
          #generate-branches-endpoint: true
          jacoco-csv-file: build/customJacocoReportDir/test/jacocoTestReport.csv

      - name: Generate coverage output
        run: |
          echo "COVERAGE=${{ steps.jacoco.outputs.coverage }}" >> $GITHUB_ENV

      - name: Update dynamic badge gist
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{secrets.GIST_SECRET}}
          gistID: 03eeb6afeb7203a9623921eeb46576b4
          filename: coverage.json
          label: Coverage
          message: ${{env.COVERAGE}}%
          valColorRange: ${{env.COVERAGE}}
          minColorRange: 0
          maxColorRange: 100

      #- name: Log coverage percentage
      #  run: |
      #    echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
      #    echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"

      #- name: Commit and push the coberage json (if it changed)
      #  uses: EndBug/add-and-commit@v9
      #  with:
      #    default_author: github_actions
      #    message: 'Commit coverage json'
      #    add: '*.json'
      #    pull: '--rebase --autostash'

      #- name: Upload JaCoCo coverage report
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: jacoco-report
      #    path: target/site/jacoco/

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
      # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
